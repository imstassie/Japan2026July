name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/install-ui-ux-pro-max-nc34p3"]
  workflow_dispatch:

# Permissions the deploy-pages action needs. Missing id-token is a common
# cause of "deploy / Timeout reached, aborting!".
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; cancel a superseded run instead of
# letting two overlap and time out.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site (repository root)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
