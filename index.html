<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#EA580C" />
<title>Япония 2026 · Маршрут</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Calistoga&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* ============================================================
     Дизайн-система (ui-ux-pro-max · "Adventure orange + map teal")
     ============================================================ */
  :root {
    --primary: #EA580C;
    --on-primary: #FFFFFF;
    --secondary: #0891B2;
    --accent: #D97706;
    --bg: #FFF7ED;
    --surface: #FFFFFF;
    --fg: #0F172A;
    --fg-soft: #475569;
    --fg-muted: #94A3B8;
    --muted: #FDF4F0;
    --border: #FCEAE1;
    --border-strong: #F3D9CC;
    --destructive: #DC2626;
    --ring: #EA580C;
    --shadow-sm: 0 1px 2px rgba(15,23,42,.06), 0 1px 3px rgba(15,23,42,.05);
    --shadow-md: 0 4px 12px rgba(15,23,42,.07), 0 2px 4px rgba(15,23,42,.04);
    --shadow-lg: 0 12px 32px rgba(234,88,12,.10), 0 4px 10px rgba(15,23,42,.06);
    --r-sm: 10px; --r-md: 16px; --r-lg: 22px; --r-xl: 28px;
    --ff-display: "Calistoga", Georgia, "Times New Roman", serif;
    --ff-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    /* категории */
    --cat-temple: #0891B2;
    --cat-food: #D97706;
    --cat-nature: #16A34A;
    --cat-museum: #7C3AED;
    --cat-shopping: #DB2777;
    --cat-view: #0EA5E9;
    --cat-landmark: #EA580C;
    --cat-other: #64748B;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: var(--ff-body);
    color: var(--fg);
    background: var(--bg);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    padding-bottom: env(safe-area-inset-bottom);
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }

  a { color: inherit; }
  button { font-family: inherit; cursor: pointer; }

  /* ---------- Header ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(140%) blur(12px);
    -webkit-backdrop-filter: saturate(140%) blur(12px);
    border-bottom: 1px solid var(--border);
    padding: calc(env(safe-area-inset-top) + 14px) 16px 12px;
  }
  .topbar-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 1100px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .brand-mark {
    width: 40px; height: 40px; border-radius: 13px; flex: none;
    background: linear-gradient(140deg, var(--primary), var(--accent));
    display: grid; place-items: center; color: #fff; box-shadow: var(--shadow-md);
  }
  .brand-mark svg { width: 22px; height: 22px; }
  .brand-txt { min-width: 0; }
  .brand-txt h1 { font-family: var(--ff-display); font-size: 1.18rem; margin: 0; line-height: 1.1; letter-spacing: -.01em; }
  .brand-txt p { margin: 1px 0 0; font-size: .8rem; color: var(--fg-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .progress { text-align: right; flex: none; }
  .progress .pct { font-family: var(--ff-display); font-size: 1.15rem; color: var(--primary); line-height: 1; }
  .progress .lbl { font-size: .68rem; color: var(--fg-muted); text-transform: uppercase; letter-spacing: .06em; }

  /* ---------- View toggle ---------- */
  .seg {
    display: inline-flex; background: var(--muted); border: 1px solid var(--border);
    border-radius: 999px; padding: 4px; gap: 4px; margin: 14px auto 0; max-width: 1100px;
  }
  .seg-wrap { display: flex; justify-content: center; }
  .seg button {
    border: 0; background: transparent; color: var(--fg-soft); font-weight: 600; font-size: .85rem;
    padding: 8px 18px; border-radius: 999px; transition: all .18s ease; display: flex; align-items: center; gap: 6px;
  }
  .seg button svg { width: 15px; height: 15px; }
  .seg button[aria-selected="true"] { background: var(--surface); color: var(--primary); box-shadow: var(--shadow-sm); }

  /* ---------- Layout ---------- */
  main { max-width: 1100px; margin: 0 auto; padding: 18px 16px 60px; }

  /* ---------- Day navigation chips ---------- */
  .daynav { display: flex; gap: 9px; overflow-x: auto; padding: 4px 2px 12px; margin: 0 -16px 6px; padding-left: 16px; padding-right: 16px; scrollbar-width: none; }
  .daynav::-webkit-scrollbar { display: none; }
  .daychip {
    flex: none; border: 1px solid var(--border-strong); background: var(--surface); border-radius: var(--r-md);
    padding: 9px 13px; min-width: 92px; text-align: left; transition: all .18s ease; box-shadow: var(--shadow-sm);
  }
  .daychip .dn { font-size: .68rem; font-weight: 700; color: var(--fg-muted); text-transform: uppercase; letter-spacing: .05em; }
  .daychip .dd { font-family: var(--ff-display); font-size: .98rem; margin-top: 1px; }
  .daychip .dc { font-size: .74rem; color: var(--secondary); font-weight: 600; margin-top: 2px; }
  .daychip[aria-current="true"] { border-color: var(--primary); background: var(--muted); box-shadow: 0 0 0 2px color-mix(in srgb, var(--primary) 22%, transparent); }

  /* ---------- Day section ---------- */
  .day { margin-top: 26px; scroll-margin-top: 150px; }
  .day-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  .day-move { flex: none; display: inline-flex; flex-direction: column; gap: 3px; }
  .day-move button { display: grid; place-items: center; width: 30px; height: 22px; border-radius: 8px;
                     border: 1px solid var(--border-strong); background: var(--surface); color: var(--fg-soft);
                     transition: background .15s ease, color .15s ease; }
  .day-move button:hover:not(:disabled) { background: var(--muted); color: var(--primary); }
  .day-move button:disabled { opacity: .35; cursor: default; }
  .day-move svg { width: 15px; height: 15px; }
  .logi-reset { margin-top: 12px; display: inline-flex; align-items: center; gap: 7px; font-size: .8rem; font-weight: 600;
                color: var(--secondary); background: color-mix(in srgb, var(--secondary) 9%, white);
                border: 1px solid color-mix(in srgb, var(--secondary) 22%, white); padding: 7px 12px; border-radius: 999px; cursor: pointer; }
  .logi-reset svg { width: 14px; height: 14px; }
  .logi-reset[hidden] { display: none; }
  .day-head h2 { font-family: var(--ff-display); font-size: 1.5rem; margin: 0; letter-spacing: -.015em; }
  .day-head .when { color: var(--fg-soft); font-size: .9rem; font-weight: 500; }
  .day-area { display: inline-flex; align-items: center; gap: 6px; color: var(--secondary); font-weight: 600; font-size: .88rem; margin-bottom: 14px; }
  .day-area svg { width: 15px; height: 15px; }
  .day-note { background: color-mix(in srgb, var(--secondary) 8%, var(--surface)); border: 1px solid color-mix(in srgb, var(--secondary) 18%, var(--border)); border-radius: var(--r-md); padding: 10px 14px; font-size: .86rem; color: var(--fg-soft); margin-bottom: 16px; }

  /* ---------- Timeline ---------- */
  .timeline { position: relative; padding-left: 4px; }
  .titem { position: relative; display: grid; grid-template-columns: 58px 1fr; gap: 12px; padding-bottom: 14px; }
  .titem:last-child { padding-bottom: 0; }
  .ttime { font-variant-numeric: tabular-nums; font-weight: 700; font-size: .82rem; color: var(--fg-soft); text-align: right; padding-top: 16px; }
  .tline { position: absolute; left: 70px; top: 0; bottom: 0; width: 2px; background: var(--border-strong); }
  .titem:last-child .tline { display: none; }

  /* place card */
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg);
    box-shadow: var(--shadow-sm); padding: 14px 15px; transition: box-shadow .18s ease, transform .18s ease, opacity .2s ease;
    position: relative; overflow: hidden;
  }
  .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--cat, var(--primary)); }
  .card:hover { box-shadow: var(--shadow-md); }
  .card.done { opacity: .58; }
  .card.done .card-title { text-decoration: line-through; text-decoration-color: var(--fg-muted); }

  .card-top { display: flex; align-items: flex-start; gap: 11px; }
  .cat-ic { width: 34px; height: 34px; border-radius: 11px; flex: none; display: grid; place-items: center;
            background: color-mix(in srgb, var(--cat) 14%, white); color: var(--cat); }
  .cat-ic svg { width: 18px; height: 18px; }
  .card-main { flex: 1; min-width: 0; }
  .card-title { font-weight: 700; font-size: 1.02rem; letter-spacing: -.01em; line-height: 1.25; }
  .card-local { font-size: .78rem; color: var(--fg-muted); margin-top: 1px; }
  .card-why { font-size: .87rem; color: var(--fg-soft); margin-top: 7px; }

  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: .73rem; font-weight: 600; padding: 4px 9px; border-radius: 999px; background: var(--muted); color: var(--fg-soft); border: 1px solid var(--border); }
  .badge svg { width: 12px; height: 12px; }
  .badge.cat { background: color-mix(in srgb, var(--cat) 13%, white); color: var(--cat); border-color: color-mix(in srgb, var(--cat) 24%, white); }
  .badge.must { background: color-mix(in srgb, var(--primary) 12%, white); color: var(--primary); border-color: color-mix(in srgb, var(--primary) 26%, white); }
  .badge.book { background: color-mix(in srgb, var(--destructive) 10%, white); color: var(--destructive); border-color: color-mix(in srgb, var(--destructive) 24%, white); }

  .card-actions { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .btn-map { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; font-size: .8rem; font-weight: 600;
             color: var(--secondary); background: color-mix(in srgb, var(--secondary) 9%, white);
             border: 1px solid color-mix(in srgb, var(--secondary) 22%, white); padding: 7px 12px; border-radius: 999px; transition: all .15s ease; }
  .btn-map:hover { background: color-mix(in srgb, var(--secondary) 16%, white); }
  .btn-map svg { width: 14px; height: 14px; }

  .day-route { margin-bottom: 16px; }
  .btn-route { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-size: .85rem; font-weight: 700;
               color: var(--on-primary); background: linear-gradient(135deg, var(--primary), var(--accent));
               padding: 10px 16px; border-radius: 999px; box-shadow: var(--shadow-md); transition: transform .15s ease, box-shadow .15s ease; }
  .btn-route:hover { transform: translateY(-1px); box-shadow: var(--shadow-lg); }
  .btn-route svg { width: 16px; height: 16px; }

  .flexbadge { display: inline-flex; align-items: center; gap: 5px; font-size: .72rem; font-weight: 700; padding: 4px 10px; border-radius: 999px;
               background: color-mix(in srgb, var(--accent) 14%, white); color: #92400e; border: 1px solid color-mix(in srgb, var(--accent) 30%, white); }
  .flexbadge svg { width: 13px; height: 13px; }
  .day-base { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; font-size: .8rem; font-weight: 600; color: var(--fg-soft);
              background: var(--muted); border: 1px solid var(--border-strong); padding: 6px 11px; border-radius: 999px; margin-bottom: 14px; transition: background .15s ease; }
  .day-base:hover { background: var(--surface); }
  .day-base svg { width: 14px; height: 14px; color: var(--primary); }

  .logi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 16px 18px; box-shadow: var(--shadow-sm); margin-bottom: 6px; }
  .logi h3 { font-family: var(--ff-display); margin: 0 0 10px; font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }
  .logi h3 svg { width: 18px; height: 18px; color: var(--primary); }
  .logi ul { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 7px; }
  .logi li { font-size: .86rem; color: var(--fg-soft); padding-left: 16px; position: relative; }
  .logi li::before { content: ""; position: absolute; left: 0; top: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--primary); }
  .logi li b { color: var(--fg); }
  .logi-hint { font-size: .82rem; color: var(--secondary); margin: 12px 0 0; font-weight: 600; }
  .chk { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; font-size: .8rem; font-weight: 600; color: var(--fg-soft); user-select: none; }
  .chk input { width: 19px; height: 19px; accent-color: var(--primary); cursor: pointer; }

  /* meal / transit / free rows */
  .softitem { display: flex; align-items: center; gap: 10px; font-size: .86rem; color: var(--fg-soft);
              background: var(--muted); border: 1px dashed var(--border-strong); border-radius: var(--r-md); padding: 10px 13px; }
  .softitem .cat-ic { width: 28px; height: 28px; border-radius: 9px; background: color-mix(in srgb, var(--cat-other) 12%, white); color: var(--cat-other); }
  .softitem .cat-ic svg { width: 15px; height: 15px; }
  .softitem b { color: var(--fg); font-weight: 600; }

  /* ---------- Catalog ---------- */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; align-items: center; }
  .search { flex: 1 1 200px; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 999px; padding: 9px 14px; box-shadow: var(--shadow-sm); }
  .search svg { width: 16px; height: 16px; color: var(--fg-muted); flex: none; }
  .search input { border: 0; outline: none; font-size: .9rem; width: 100%; background: transparent; color: var(--fg); }
  .chipfilter { border: 1px solid var(--border-strong); background: var(--surface); color: var(--fg-soft); font-weight: 600; font-size: .8rem; padding: 8px 13px; border-radius: 999px; transition: all .15s ease; }
  .chipfilter[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }

  .grid { display: grid; grid-template-columns: 1fr; gap: 13px; }
  @media (min-width: 620px) { .grid { grid-template-columns: 1fr 1fr; } }
  @media (min-width: 980px) { .grid { grid-template-columns: 1fr 1fr 1fr; } }

  .empty { text-align: center; color: var(--fg-muted); padding: 50px 16px; font-size: .92rem; }

  .hidden { display: none !important; }

  /* ---------- Help / footer ---------- */
  .help { margin-top: 40px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 18px 18px; box-shadow: var(--shadow-sm); }
  .help h3 { font-family: var(--ff-display); margin: 0 0 8px; font-size: 1.05rem; }
  .help p, .help li { font-size: .85rem; color: var(--fg-soft); }
  .help code { background: var(--muted); padding: 1px 6px; border-radius: 6px; font-size: .8em; border: 1px solid var(--border); }
  .sample-note { display: flex; align-items: center; gap: 8px; background: color-mix(in srgb, var(--accent) 12%, white); border: 1px solid color-mix(in srgb, var(--accent) 28%, white); color: #92400e; border-radius: var(--r-md); padding: 11px 14px; font-size: .85rem; font-weight: 500; margin-bottom: 16px; }
  .sample-note svg { width: 18px; height: 18px; flex: none; }

  /* ---------- Вкладки городов (в шапке) ---------- */
  .tabs { display: flex; gap: 8px; overflow-x: auto; max-width: 1100px; margin: 14px auto 0; padding-bottom: 2px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; border: 1px solid var(--border-strong); background: var(--surface); color: var(--fg-soft); font-weight: 700;
         font-size: .85rem; padding: 8px 15px; border-radius: 999px; cursor: pointer; white-space: nowrap;
         transition: color .15s ease, background .15s ease, border-color .15s ease; }
  .tab:hover { color: var(--primary); }
  .tab.active { background: var(--primary); border-color: var(--primary); color: var(--on-primary); box-shadow: var(--shadow-sm); }
  .tab .cnt { font-size: .8em; opacity: .7; margin-left: 5px; font-weight: 600; }

  /* ---------- Вкладки районов (внутри города) ---------- */
  .areatabs { display: flex; gap: 7px; overflow-x: auto; padding: 2px 0 4px; margin-bottom: 4px; scrollbar-width: none; }
  .areatabs::-webkit-scrollbar { display: none; }
  .areatabs[hidden] { display: none; }
  .areatab { flex: none; border: 1px solid var(--border-strong); background: var(--surface); color: var(--fg-soft); font-weight: 600;
             font-size: .8rem; padding: 6px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap;
             transition: color .15s ease, background .15s ease, border-color .15s ease; }
  .areatab:hover { color: var(--secondary); }
  .areatab.active { background: var(--secondary); border-color: var(--secondary); color: #fff; }
  .areatab .cnt { font-size: .82em; opacity: .7; margin-left: 4px; }

  /* ---------- Фильтр по типу места ---------- */
  .cattabs { display: flex; gap: 7px; overflow-x: auto; padding: 2px 0 10px; scrollbar-width: none; }
  .cattabs::-webkit-scrollbar { display: none; }
  .cattab { flex: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border-strong); background: var(--surface);
            color: var(--fg-soft); font-weight: 600; font-size: .8rem; padding: 6px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap;
            transition: color .15s ease, background .15s ease, border-color .15s ease; }
  .cattab .catdot { width: 9px; height: 9px; border-radius: 50%; background: var(--cat, var(--fg-muted)); flex: none; }
  .cattab .cnt { font-size: .82em; opacity: .7; }
  .cattab:hover { color: var(--fg); }
  .cattab.active { color: #fff; background: var(--cat, var(--primary)); border-color: var(--cat, var(--primary)); }
  .cattab.active .catdot { background: #fff; }

  /* ---------- Города и районы ---------- */
  .toolbar { margin-bottom: 6px; }
  .citynav { display: flex; gap: 8px; overflow-x: auto; padding: 4px 16px 10px; margin: 0 -16px; scrollbar-width: none; }
  .citynav::-webkit-scrollbar { display: none; }
  .citychip { flex: none; border: 1px solid var(--border-strong); background: var(--surface); border-radius: 999px;
              padding: 8px 15px; font-weight: 700; font-size: .86rem; color: var(--fg-soft); box-shadow: var(--shadow-sm);
              transition: color .15s ease, border-color .15s ease; cursor: pointer; }
  .citychip:hover { color: var(--primary); border-color: var(--primary); }
  .citychip .cnt { color: var(--fg-muted); font-weight: 600; font-size: .8em; margin-left: 5px; }
  .city-sec { margin-top: 30px; scroll-margin-top: 92px; }
  .city-head { display: flex; align-items: center; gap: 11px; flex-wrap: wrap; }
  .city-head h2 { font-family: var(--ff-display); font-size: 1.7rem; margin: 0; letter-spacing: -.015em; }
  .city-head .city-cnt { font-size: .82rem; color: var(--fg-muted); font-weight: 600; }
  .city-hotel { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; font-size: .8rem; font-weight: 600;
                color: var(--fg-soft); background: var(--muted); border: 1px solid var(--border-strong); padding: 5px 11px; border-radius: 999px; }
  .city-hotel:hover { background: var(--surface); }
  .city-hotel svg { width: 14px; height: 14px; color: var(--primary); }
  .city-note { background: color-mix(in srgb, var(--secondary) 8%, var(--surface)); border: 1px solid color-mix(in srgb, var(--secondary) 18%, var(--border));
               border-radius: var(--r-md); padding: 9px 13px; font-size: .84rem; color: var(--fg-soft); margin-top: 11px; }
  .area-sec { margin-top: 18px; }
  .area-head { display: flex; align-items: center; gap: 7px; font-family: var(--ff-display); font-size: 1.08rem; color: var(--secondary); margin: 0 0 11px;
               padding-bottom: 7px; border-bottom: 1px solid var(--border); }
  .area-head svg { width: 16px; height: 16px; flex: none; }
  .area-head .acnt { font-family: var(--ff-body); font-size: .72rem; color: var(--fg-muted); font-weight: 600; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-row">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
      </span>
      <div class="brand-txt">
        <h1 id="tripTitle">Япония 2026</h1>
        <p id="tripSub">Июль 2026 · маршрут</p>
      </div>
    </div>
    <div class="progress">
      <div class="pct"><span id="visCount">0</span>/<span id="totCount">0</span></div>
      <div class="lbl">посещено</div>
    </div>
  </div>
  <div class="tabs" id="cityTabs" role="tablist"></div>
</header>

<main>
  <div class="toolbar">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="search" id="searchInput" placeholder="Поиск места или района…" oninput="renderPlaces()" />
    </label>
  </div>
  <nav class="areatabs" id="areaTabs" aria-label="Районы" hidden></nav>
  <nav class="cattabs" id="catTabs" aria-label="Типы мест"></nav>
  <div id="placesContainer"></div>
  <p class="empty hidden" id="emptyMsg">Ничего не найдено.</p>

</main>

<script>

const ORDER_KEY = "japan2026_order";

let savedOrder = JSON.parse(localStorage.getItem(ORDER_KEY) || "null");
function getOrderedIdx() {
  const all = DAYS.map((d, i) => i);
  if (!savedOrder) return all;
  const byKey = new Map(DAYS.map((d, i) => [dayKey(d), i]));
  const used = new Set(), ord = [];
  savedOrder.forEach(k => { if (byKey.has(k) && !used.has(k)) { ord.push(byKey.get(k)); used.add(k); } });
  all.forEach(i => { if (!used.has(dayKey(DAYS[i]))) ord.push(i); });
  return ord;
}
function persistOrder(idxArr) {
  savedOrder = idxArr.map(i => dayKey(DAYS[i]));

}

const WD = ["вс","пн","вт","ср","чт","пт","сб"];
const MO = ["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
function fmtDate(iso) {
  const d = new Date(iso + "T00:00:00");
  if (isNaN(d)) return iso;
  return `${WD[d.getDay()]}, ${d.getDate()} ${MO[d.getMonth()]}`;
}
function mapsLink(p) {
  if (p.lat != null && p.lng != null) return `https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`;
  const q = encodeURIComponent(`${p.name} ${p.local ? p.local.split("·")[0] : ""} ${p.city} Japan`);
  return `https://www.google.com/maps/search/?api=1&query=${q}`;
}

// Маршрут одного дня в Google Maps: отель → точки по порядку → обратно в отель (транспорт)
function dayRouteUrl(day) {
  const pts = day.items.filter(it => it.placeId && placeById[it.placeId]).map(it => placeById[it.placeId]);
  if (!pts.length) return null;
  const base = baseForDay(day);
  const stops = base ? [base, ...pts, base] : pts;
  const loc = p => (p.lat != null && p.lng != null) ? `${p.lat},${p.lng}` : `${p.name} ${p.city} Japan`;
  const enc = encodeURIComponent;
  const origin = enc(loc(stops[0]));
  const destination = enc(loc(stops[stops.length - 1]));
  const waypoints = stops.slice(1, -1).slice(0, 9).map(p => enc(loc(p))).join("%7C"); // Google: до 9 промежуточных точек
  let u = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}&travelmode=transit`;
  if (waypoints) u += `&waypoints=${waypoints}`;
  return u;
}

        <div class="badges">${badges.join("")}</div>
        <div class="card-actions">
          <a class="btn-map" href="${mapsLink(p)}" target="_blank" rel="noopener">${svg('<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>')}В картах</a>
          ${withChk ? `<label class="chk"><input type="checkbox" ${done ? "checked" : ""} onchange="toggle('${p.id}')"/>посетили</label>` : ""}
        </div>
      </div>
    </div>
  </article>`;
}

function softRow(it) {
  const t = it.type;
  return `<div class="softitem">
    <span class="cat-ic">${svg(ICONS[t] || ICONS.other)}</span>
    <div><b>${it.title || ""}</b>${it.note ? ` — ${it.note}` : ""}</div>
  </div>`;
}

function renderDays() {
  const nav = document.getElementById("dayNav");
  const cont = document.getElementById("daysContainer");
  const ord = getOrderedIdx();

  nav.innerHTML = ord.map((di, pos) => {
    const d = DAYS[di];
    return `<button class="daychip" ${pos===0?'aria-current="true"':''} ${d.flex?'data-flex="1"':''} onclick="jumpDay(${pos})">
       <div class="dn">День ${pos+1}${d.flex?" · гибкий":""}</div>
       <div class="dd">${d.city}</div>
       <div class="dc">${d.label || ""}</div>
     </button>`;
  }).join("");

  cont.innerHTML = ord.map((di, pos) => {
    const d = DAYS[di];
    const rows = d.items.map(it => {
      const body = it.placeId
        ? placeCard(placeById[it.placeId] || { id: it.placeId, name: "⚠ " + it.placeId, cat: "other" })
        : softRow(it);
      return `<div class="titem">
        <div class="ttime">${it.time || ""}</div>
        <div class="tline"></div>
        <div>${body}</div>
      </div>`;
    }).join("");
    const route = dayRouteUrl(d);
    const base = baseForDay(d);
    return `<section class="day" id="day-${pos}">
      <div class="day-head">
        <span class="day-move">
          <button onclick="moveDay(${pos},-1)" ${pos===0?"disabled":""} aria-label="Поднять день" title="Поднять день выше">${svg(UP_ICON)}</button>
          <button onclick="moveDay(${pos},1)" ${pos===ord.length-1?"disabled":""} aria-label="Опустить день" title="Опустить день ниже">${svg(DOWN_ICON)}</button>
        </span>
        <h2>День ${pos+1}</h2>
        <span class="when">${d.city}${d.label ? " · " + d.label : ""}</span>
        ${d.flex ? `<span class="flexbadge">${svg(FLEX_ICON)}гибкий день</span>` : ""}
      </div>
      ${d.area ? `<div class="day-area">${svg('<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>')}${d.area}</div>` : ""}
      ${base ? `<a class="day-base" href="${mapsLink(base)}" target="_blank" rel="noopener">${svg(BED_ICON)}База: ${base.name}</a>` : ""}
      ${d.note ? `<div class="day-note">${d.note}</div>` : ""}
      ${route ? `<div class="day-route"><a class="btn-route" href="${route}" target="_blank" rel="noopener">${svg(ROUTE_ICON)}Маршрут дня в Google Maps</a></div>` : ""}
      <div class="timeline">${rows}</div>
    </section>`;
  }).join("");

  updateResetBtn();
}

// ---- Перестановка дней кнопками ↑/↓ ----
function moveDay(pos, dir) {
  const ord = getOrderedIdx();
  const j = pos + dir;
  if (j < 0 || j >= ord.length) return;
  [ord[pos], ord[j]] = [ord[j], ord[pos]];
  persistOrder(ord);
  renderDays();
  document.getElementById("day-" + j)?.scrollIntoView({ block: "center", behavior: "smooth" });
}

function toggle(id) {
  if (visited.has(id)) visited.delete(id); else visited.add(id);
  saveVisited();
  document.querySelectorAll(`.card[data-id="${id}"]`).forEach(c => c.classList.toggle("done"));
  document.querySelectorAll(`.card[data-id="${id}"] input[type=checkbox]`).forEach(cb => cb.checked = visited.has(id));
  updateProgress();
}
function updateProgress() {
  document.getElementById("visCount").textContent = PLACES.filter(p => visited.has(p.id)).length;
  document.getElementById("totCount").textContent = PLACES.length;
}

// ---- Группировка: город → район ----
const CITY_ORDER = ["Токио", "Камакура", "Фудзи", "Осака", "Киото", "Нара"];
const CITY_NOTE = {
  "Камакура": "День-трип из Токио — поезд ~1 ч (JR Shōnan-Shinjuku Line). Для перемещений по городу возьмите проездной Enoden 1-Day Pass «Noriorikun» (800 ¥) — катайтесь по линии Эноден без ограничений весь день.",
  "Фудзи": "День-трип из Токио — автобус из Синдзюку ~2 ч (бронь заранее). Гора часто в облаках — лучше ясным утром.",
  "Осака": "База Осаки. Вылет 20 июля 09:00 из KIX — выезжать ~05:30 или подумать о ночи у аэропорта.",
  "Киото": "День-трип из Осаки — поезд 15–45 мин (JR / Hankyu / Keihan).",
  "Нара": "День-трип из Осаки — поезд ~45 мин (Kintetsu / JR).",
};
const CITY_HOTEL = { "Токио": HOTELS.tokyo, "Осака": HOTELS.osaka };
const PIN_ICON = '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>';

function orderedCities() {
  const present = [...new Set(PLACES.map(p => p.city))];
  const ranked = CITY_ORDER.filter(c => present.includes(c));
  present.forEach(c => { if (!ranked.includes(c)) ranked.push(c); });
  return ranked;
}
let activeCity = localStorage.getItem("japan2026_tab") || "all";
let activeArea = "all";

function cityAreas(city) {
  const areas = [];
  PLACES.filter(p => p.city === city).forEach(p => { const a = p.area || "—"; if (!areas.includes(a)) areas.push(a); });
  return areas;
}
function renderTabs() {
  let h = `<button class="tab ${activeCity==="all"?"active":""}" onclick="setCity('all')">Все места<span class="cnt">${PLACES.length}</span></button>`;
  orderedCities().forEach(c => {
    const n = PLACES.filter(p => p.city === c).length;
    h += `<button class="tab ${activeCity===c?"active":""}" onclick="setCity('${c}')">${c}<span class="cnt">${n}</span></button>`;
  });
  document.getElementById("cityTabs").innerHTML = h;
}
function renderAreaTabs() {
  const el = document.getElementById("areaTabs");
  if (activeCity === "all") { el.hidden = true; el.innerHTML = ""; return; }
  const inCity = PLACES.filter(p => p.city === activeCity);
  let h = `<button class="areatab ${activeArea==="all"?"active":""}" onclick="setArea('all')">Все районы<span class="cnt">${inCity.length}</span></button>`;
  cityAreas(activeCity).forEach(a => {
    const n = inCity.filter(p => (p.area || "—") === a).length;
    h += `<button class="areatab ${activeArea===a?"active":""}" onclick="setArea('${a.replace(/'/g, "\\'")}')">${a}<span class="cnt">${n}</span></button>`;
  });
  el.hidden = false;
  el.innerHTML = h;
}
function setCity(c) {
  activeCity = c;
  activeArea = "all";
  localStorage.setItem("japan2026_tab", c);
  renderTabs();
  renderAreaTabs();
  renderPlaces();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function setArea(a) {
  activeArea = a;
  renderAreaTabs();
  renderPlaces();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
let activeCat = "all";
// Список в текущей области (город + район + поиск), без фильтра по типу
function scopeList() {
  const q = (document.getElementById("searchInput").value || "").toLowerCase().trim();
  const match = p => !q || `${p.name} ${p.local||""} ${p.area||""} ${p.city} ${(CAT_META[p.cat]||{}).ru||""} ${p.why||""}`.toLowerCase().includes(q);
  return PLACES.filter(p => {
    if (activeCity !== "all" && p.city !== activeCity) return false;
    if (activeCity !== "all" && activeArea !== "all" && (p.area || "—") !== activeArea) return false;
    return match(p);
  });
}
function renderCatTabs(base) {
  let h = `<button class="cattab ${activeCat==="all"?"active":""}" onclick="setCat('all')">Все типы<span class="cnt">${base.length}</span></button>`;
  Object.keys(CAT_META).forEach(c => {
    const n = base.filter(p => p.cat === c).length;
    if (!n) return;
    h += `<button class="cattab ${activeCat===c?"active":""}" style="--cat:var(--cat-${CAT_META[c].v})" onclick="setCat('${c}')"><span class="catdot"></span>${CAT_META[c].ru}<span class="cnt">${n}</span></button>`;
  });
  document.getElementById("catTabs").innerHTML = h;
}
function setCat(c) { activeCat = c; renderPlaces(); window.scrollTo({ top: 0, behavior: "smooth" }); }

function renderPlaces() {
  const base = scopeList();
  renderCatTabs(base);
  const visible = base.filter(p => activeCat === "all" || p.cat === activeCat);

  let html = "", any = false;
  orderedCities().forEach((city, ci) => {
    const inCity = visible.filter(p => p.city === city);
    if (!inCity.length) return;
    any = true;

    const areas = [];
    inCity.forEach(p => { const a = p.area || "—"; if (!areas.includes(a)) areas.push(a); });

    const body = areas.map(a => {
      const cards = inCity.filter(p => (p.area || "—") === a);
      return `<div class="area-sec">
        <h3 class="area-head">${svg(PIN_ICON)}${a}<span class="acnt">${cards.length}</span></h3>
        <div class="grid">${cards.map(p => placeCard(p)).join("")}</div>
      </div>`;
    }).join("");

    const hotel = CITY_HOTEL[city], note = CITY_NOTE[city];
    html += `<section class="city-sec" id="city-${ci}">
      <div class="city-head">
        <h2>${city}</h2>
        <span class="city-cnt">${inCity.length} мест</span>
        ${hotel ? `<a class="city-hotel" href="${mapsLink(hotel)}" target="_blank" rel="noopener">${svg(BED_ICON)}${hotel.name}</a>` : ""}
      </div>
      ${note ? `<div class="city-note">${note}</div>` : ""}
      ${body}
    </section>`;
  });

  document.getElementById("placesContainer").innerHTML = html;
  document.getElementById("emptyMsg").classList.toggle("hidden", any);
}

// init
document.getElementById("tripTitle").textContent = TRIP.title;
document.getElementById("tripSub").textContent = TRIP.subtitle;
renderTabs();
renderAreaTabs();
renderPlaces();
updateProgress();
</script>
</body>
</html>
